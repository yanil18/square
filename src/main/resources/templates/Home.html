<!DOCTYPE html >
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="_csrf" th:content="${_csrf.token}" />
    <!-- default header name is X-CSRF-TOKEN -->
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Modern Landing Page</title>
 <link th:href="@{/CSS/styles.css}" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Logo</div>
            <ul class="nav-links">
                <li><a href="#"> Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="auth-buttons">
                <button id="login-btn">Login</button>
                <button id="signup-btn">Sign Up</button>
            </div>
        </nav>
    </header>
<input type="hidden" id="context_path"
			th:value="${#httpServletRequest.getContextPath()}"></input>
    <main>
        <section class="hero">
            <h1>Welcome to Our Website</h1>
            <p>Discover amazing features and services.</p>
            <button class="cta-button">Learn More</button>
        </section>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    </main>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Login</h2>
            <form th:action="@{/login}" method="post">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" required>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required>
                <div class="col-md-12">
                    <div class="input-block captcha">
                        <div class="captcha-block">
                            <img id="imageidcap" alt="captcha" th:src=@{/captcha}>  
                            <a href="javascript:refreshCaptcha();"
                                id="change-image"> <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                                </svg>
                            </a> 
                        </div>
                        <input class="form-control" onkeyup="this.value = this.value.replace(/[^0-9a-zA-Z]/g,'').substring(0,5);"
                        name="captcha" placeholder="Enter Captcha" required /> 
                    </div>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <div id="signup-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Sign Up</h2>
            <form th:action="@{addusers}" method="post" enctype="multipart/form-data">
                <label for="signup-name">Name:</label>
                <input type="text" id="signup-email" name="name" required>
                <label for="signup-mobile">Mobile No.:</label>
                <input type="number" id="signup-email" name="mobileno" required>
                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" name="email" required>
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" name="password" required>
                 <label for="signup-confirmpassword">Confirm Password:</label>
                <input type="password" id="signup-confirmpassword" name="confirmpassword" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>

    

    <script th:src="@{/JS/jquery.min.3.7.1.js}"></script>
    <script th:src="@{/JS/cryptoJS.js}"></script>
    <script th:src="@{/JS/code.js}"></script>
  	<script th:src="@{/JS/csrfToken.js}"></script>
	<script th:src="@{/JS/aesUtil.js}"></script>
	<script th:src="@{/JS/forge.js}"></script>
	<script th:src="@{/JS/HybridEncryption.js}"></script>

    <script th:src="@{/JS/script.js}"></script>
</body>
</html>
